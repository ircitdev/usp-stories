appId: id.bangtutorial.bangstory
productName: USP Stories
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/flow
    to: flow
  - from: resources/gemini
    to: gemini
  - from: resources/chrome
    to: chrome
  - from: resources/chatgpt
    to: chatgpt
  - from: resources/workflows
    to: workflows
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: licenses/FFmpeg-LICENSE.txt
  - from: resources/licenses
    to: licenses
  - from: resources/whisper
    to: whisper
asarUnpack:
  - node_modules/ffmpeg-static/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: USPStories-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: USP Stories
npmRebuild: true
